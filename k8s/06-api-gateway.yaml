apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cognivita
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /actuator/prometheus
    prometheus.io/port: "9090"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: wait-for-eureka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z eureka-server 8761; do sleep 2; done"]
      containers:
        - name: api-gateway
          image: medsadek/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9090
          env:
            - name: SERVER_PORT
              value: "9090"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: http://eureka-server:8761/eureka/
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cognivita
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 9090
      targetPort: 9090
