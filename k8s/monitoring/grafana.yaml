apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: cognivita
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: cognivita
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: Cognivita
        orgId: 1
        folder: Cognivita
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
