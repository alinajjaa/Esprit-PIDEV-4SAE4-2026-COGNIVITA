apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cognivita
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
        - name: wait-for-gateway
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z api-gateway 9090; do sleep 2; done"]
      containers:
        - name: frontend
          image: medsadek/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cognivita
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 4200
      targetPort: 80
      nodePort: 30420
