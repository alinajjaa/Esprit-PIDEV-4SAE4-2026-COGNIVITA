<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Monitoring</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; background: #f8fafc; color: #0f172a; }
    h1 { margin: 0 0 12px; }
    .muted { color: #475569; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e2e8f0; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    th { background: #f1f5f9; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 999px; font-weight: 700; font-size: 12px; }
    .up { background: #dcfce7; color: #166534; }
    .down { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <h1>Microservices Status</h1>
  <div class="muted">Shows expected services even when they are down. Refreshes every 5 seconds.</div>

  <table>
    <thead>
      <tr>
        <th>Service</th>
        <th>Status</th>
        <th>UP Instances</th>
        <th>Total Instances</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="4">Loading...</td></tr>
    </tbody>
  </table>

  <script>
    async function loadStatuses() {
      const body = document.getElementById('rows');
      try {
        const res = await fetch('/monitoring/services');
        const data = await res.json();
        body.innerHTML = data.map(s => `
          <tr>
            <td>${s.serviceName}</td>
            <td><span class="badge ${s.status === 'UP' ? 'up' : 'down'}">${s.status}</span></td>
            <td>${s.upInstances}</td>
            <td>${s.totalInstances}</td>
          </tr>
        `).join('');
      } catch (e) {
        body.innerHTML = '<tr><td colspan="4">Failed to load statuses.</td></tr>';
      }
    }

    loadStatuses();
    setInterval(loadStatuses, 5000);
  </script>
</body>
</html>
