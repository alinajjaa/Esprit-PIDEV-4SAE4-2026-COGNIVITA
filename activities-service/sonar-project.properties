# ==========================================================
# SonarQube - activities-service
# ==========================================================

# Identité du projet
sonar.projectKey=cognivita:activities-service
sonar.projectName=activities-service
sonar.projectVersion=1.0.0

# Sources / tests
sonar.sources=src/main
sonar.tests=src/test
sonar.sourceEncoding=UTF-8

# Java / binaries (nécessaire pour certaines règles)
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Exclusions classiques
sonar.exclusions=**/target/**,**/generated/**,**/*Application.java

# Couverture (si tu ajoutes JaCoCo plus tard)
# sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

