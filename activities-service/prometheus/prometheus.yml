global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # ----------------------------------------------------------
  # Spring Boot (Micrometer) - /api/actuator/prometheus
  # ----------------------------------------------------------
  - job_name: 'activities-service'
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ['activities-service:8087']

  # ----------------------------------------------------------
  # MySQL Exporter (metrics)
  # ----------------------------------------------------------
  - job_name: 'mysql-activities'
    static_configs:
      - targets: ['mysql-activities-exporter:9104']

