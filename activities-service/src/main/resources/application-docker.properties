# ==========================================================
# Profil "docker" : configuration utilisée via docker-compose
# ==========================================================

# IMPORTANT : en Docker Compose, le host MySQL est le nom du service
# (ici: mysql-activities) et le port interne MySQL est 3306.
spring.datasource.url=jdbc:mysql://mysql-activities:3306/cognivita_activities?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=cognivita
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# (Optionnel) Réduit un peu le bruit de logs en conteneur
logging.level.org.hibernate.type.descriptor.sql=INFO
