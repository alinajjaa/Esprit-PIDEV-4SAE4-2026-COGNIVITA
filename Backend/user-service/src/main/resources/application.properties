spring.application.name=user-service
server.port=8082
eureka.client.service-url.defaultZone=http://localhost:8080/eureka/

# Database Configuration (shared MySQL)
# IMPORTANT: set spring.datasource.password to your real MySQL root password (or another user)
spring.datasource.url=jdbc:mysql://localhost:3306/alzheimer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Ensure schema is created before running data.sql and always load seed data (even on MySQL)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
