spring.application.name=config-server-service

# Port — override via CONFIG_SERVER_PORT env var if needed
server.port=${CONFIG_SERVER_PORT:8888}

# Serve config files from the config-repo directory co-located with this service.
# Override CONFIG_REPO_PATH to point elsewhere (e.g. a Git repo in CI/CD).
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO_PATH:file:./config-repo}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

management.endpoints.web.exposure.include=health,info
