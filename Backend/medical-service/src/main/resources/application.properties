spring.application.name=medical-service
server.port=8083
eureka.client.service-url.defaultZone=http://localhost:8080/eureka/
# Do not fail startup if Eureka is not available
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Database Configuration (shared MySQL). Password: set here or via env MYSQL_PASSWORD.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/alzheimer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
# Leave empty if MySQL root has no password; or set MYSQL_PASSWORD=yourpassword when running
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
