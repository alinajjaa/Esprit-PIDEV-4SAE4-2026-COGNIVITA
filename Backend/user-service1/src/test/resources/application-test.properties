# ============================================================
# DATABASE CONFIGURATION (H2 in-memory for tests)
# ============================================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
# JPA CONFIGURATION
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ============================================================
# DISABLE EXTERNAL SERVICES FOR TESTS
# ============================================================
spring.cloud.config.enabled=false
eureka.client.enabled=false

# ============================================================
# JWT CONFIGURATION
# ============================================================
JWT_SECRET=test-secret-key-for-junit-tests-minimum-32-characters-long-string-for-security

# ============================================================
# CLOUDINARY CONFIGURATION (fake values for testing)
# ============================================================
CLOUDINARY_CLOUD_NAME=test-cloud
CLOUDINARY_API_KEY=123456789012345
CLOUDINARY_API_SECRET=test-secret-key-for-cloudinary-testing

# ============================================================
# EMAIL SERVICE CONFIGURATION (fake SMTP for testing)
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test-email@gmail.com
spring.mail.password=test-password-fake
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# FACE AUTHENTICATION SERVICE (mock URL for testing)
# ============================================================
FACE_AUTH_SERVICE_URL=http://localhost:5001

# ============================================================
# OAUTH2 CONFIGURATION (fake credentials for testing)
# ============================================================
# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=fake-google-client-id-for-testing
spring.security.oauth2.client.registration.google.client-secret=fake-google-client-secret-for-testing
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# Facebook OAuth2
spring.security.oauth2.client.registration.facebook.client-id=fake-facebook-client-id-for-testing
spring.security.oauth2.client.registration.facebook.client-secret=fake-facebook-client-secret-for-testing
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/facebook

# ============================================================
# APPLICATION CONFIGURATION
# ============================================================
spring.application.name=user-service1-test
server.port=8081

# ============================================================
# FRONTEND URL (for CORS during testing)
# ============================================================
FRONTEND_URL=http://localhost:4200

# ============================================================
# TWO-FACTOR AUTHENTICATION (if used)
# ============================================================
TWO_FA_ENABLED=false

# ============================================================
# LOGGING CONFIGURATION (reduce noise in tests)
# ============================================================
logging.level.root=WARN
logging.level.esprit.edu.userservice1=INFO