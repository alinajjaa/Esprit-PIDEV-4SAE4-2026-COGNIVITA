name: CI PlanSuivi

on:
  push:
    paths:
      - "planSuivi/planSuivi/**"
      - ".github/workflows/ci-plansuivi.yml"
      - ".github/workflows/cd-plansuivi.yml"
  pull_request:
    paths:
      - "planSuivi/planSuivi/**"
      - ".github/workflows/ci-plansuivi.yml"
      - ".github/workflows/cd-plansuivi.yml"

jobs:
  test-plansuivi:
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: planSuivi/planSuivi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Unit tests + coverage report
        run: mvn -B clean verify

      - name: Package
        run: mvn -B -DskipTests package

      - name: SonarQube analysis (if secrets configured)
        if: ${{ env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != '' }}
        run: >
          mvn -B sonar:sonar
          -Dsonar.projectKey=cognivita-plansuivi
          -Dsonar.projectName=COGNIVITA-PlanSuivi
          -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
          -Dsonar.token=${{ env.SONAR_TOKEN }}
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
