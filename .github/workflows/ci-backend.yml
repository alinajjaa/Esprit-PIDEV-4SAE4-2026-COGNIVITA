name: Backend CI (Microservices)

on:
  push:
    paths:
      - "api-gateway/**"
      - "activities-service/**"
      - "eureka-server/**"
      - "family-tree-service/**"
      - "health-prevention-service/**"
      - "medical-records-service/**"
      - "medication-adherence-service/**"
      - "mmse-service/**"
      - "notification-service/**"
      - "user-service/**"
      - "pi/pi/**"
      - "planSuivi/planSuivi/**"
      - "Backend/**"
      - ".github/workflows/ci-backend.yml"
      - ".github/workflows/cd-backend.yml"
  pull_request:
    paths:
      - "api-gateway/**"
      - "activities-service/**"
      - "eureka-server/**"
      - "family-tree-service/**"
      - "health-prevention-service/**"
      - "medical-records-service/**"
      - "medication-adherence-service/**"
      - "mmse-service/**"
      - "notification-service/**"
      - "user-service/**"
      - "pi/pi/**"
      - "planSuivi/planSuivi/**"
      - "Backend/**"
      - ".github/workflows/ci-backend.yml"
      - ".github/workflows/cd-backend.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: api-gateway
          - name: activities-service
            path: activities-service
          - name: eureka-server
            path: eureka-server
          - name: family-tree-service
            path: family-tree-service
          - name: health-prevention-service
            path: health-prevention-service
          - name: medical-records-service
            path: medical-records-service
          - name: medication-adherence-service
            path: medication-adherence-service
          - name: mmse-service
            path: mmse-service
          - name: notification-service
            path: notification-service
          - name: user-service
            path: user-service
          - name: pi
            path: pi/pi
          - name: plan-suivi
            path: planSuivi/planSuivi
          - name: backend-monolith
            path: Backend

    defaults:
      run:
        working-directory: ${{ matrix.service.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run unit tests
        run: mvn -B test
