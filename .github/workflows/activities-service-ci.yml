name: Activities Service CI/CD

on:
  push:
    paths:
      - 'activities-service/**'
  pull_request:
    paths:
      - 'activities-service/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cognivita-activities:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('activities-service/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build activities-service with Maven
        run: mvn -f activities-service/pom.xml clean package -DskipTests

      - name: Run SonarQube analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -f activities-service/pom.xml sonar:sonar -Dsonar.host.url=${{ env.SONAR_HOST_URL }} -Dsonar.login=${{ env.SONAR_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: activities-service
          file: activities-service/Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE }}
