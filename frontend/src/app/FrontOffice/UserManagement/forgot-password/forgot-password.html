<div class="page">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card"
    [class.shake]="cardShake"
    [class.success-pulse]="cardSuccess">

    <div class="card-header">
      <span class="header-icon">🔑</span>
      <div class="card-title">FORGOT PASSWORD</div>
      <div class="card-subtitle">We'll send you a reset link</div>
    </div>

    <div class="divider"></div>

    <form class="form" [formGroup]="form" (ngSubmit)="submit()">

      <!-- Email -->
      <div class="field-group">
        <div class="field-label"><span>📡</span> Email Address</div>
        <div class="field-input-wrap">
          <input class="field-input"
            [class.input-error]="email.invalid && email.touched"
            [class.input-success]="email.valid && email.touched && isSuccess"
            type="email"
            placeholder="you@example.com"
            formControlName="email"
            [attr.disabled]="isSuccess ? true : null"
          />
          <span class="input-icon" *ngIf="email.valid && email.touched && !loading">✅</span>
          <span class="input-icon" *ngIf="email.invalid && email.touched">❌</span>
          <span class="input-icon spin" *ngIf="loading">⟳</span>
        </div>

        <div class="field-error" *ngIf="email.touched && email.errors">
          <span *ngIf="email.errors?.['required']">⚠ Email is required</span>
          <span *ngIf="email.errors?.['email']">⚠ Invalid email format</span>
        </div>
      </div>

      <!-- Status message -->
      <div *ngIf="message" class="status-msg"
        [class.success]="isSuccess"
        [class.error]="!isSuccess">
        <span>{{ isSuccess ? '✅' : '❌' }}</span> {{ message }}
      </div>

      <!-- Submit -->
      <button class="submit-btn" type="submit"
        [disabled]="loading || isSuccess">
        <span [class.rotating]="loading">{{ loading ? '⟳' : isSuccess ? '✅' : '📨' }}</span>
        <span>{{ loading ? 'SENDING...' : isSuccess ? 'EMAIL SENT!' : 'SEND RESET LINK' }}</span>
      </button>

      <a routerLink="/login" class="back-link">← Back to Login</a>

    </form>
  </div>
</div>
