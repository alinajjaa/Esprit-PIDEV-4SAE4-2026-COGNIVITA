version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: cognivita-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-alzheimerdb1}
      MYSQL_USER: ${MYSQL_USER:-cognivita_user}
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD:-root123}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./setup_database.sql:/docker-entrypoint-initdb.d/setup_database.sql
    networks:
      - cognivita-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: cognivita-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
    ports:
      - "8889:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cognivita-network

  # Config Server
  config-server:
    build:
      context: ./Backend/config-server-service
      dockerfile: Dockerfile
    container_name: cognivita-config-server
    environment:
      CONFIG_SERVER_PORT: 8888
      CONFIG_REPO_PATH: file:./config-repo
      EUREKA_URL: http://eureka:8761/eureka
    ports:
      - "8888:8888"
    networks:
      - cognivita-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Eureka Discovery Server
  eureka:
    build:
      context: ./Backend/eureka-service
      dockerfile: Dockerfile
    container_name: cognivita-eureka
    environment:
      EUREKA_PORT: 8761
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - cognivita-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # API Gateway
  gateway:
    build:
      context: ./Backend/gateway-service
      dockerfile: Dockerfile
    container_name: cognivita-gateway
    environment:
      GATEWAY_PORT: 8080
      EUREKA_URL: http://eureka:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8080:8080"
    depends_on:
      eureka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - cognivita-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # User Service
  user-service:
    build:
      context: ./Backend/user-service1
      dockerfile: Dockerfile
    container_name: cognivita-user-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/alzheimerdb1?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      JWT_SECRET: ${JWT_SECRET:-dGhpc2lzYXZlcnlzZWNyZXRrZXlmb3Jqd3R0b2tlbmdlbmVyYXRpb24=}
      JWT_EXPIRATION: 86400000
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      FACE_AUTH_URL: http://face-auth:5001
      EUREKA_URL: http://eureka:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      JPA_DDL: update
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      - cognivita-network

  # Face Auth Service (Flask)
  face-auth:
    build:
      context: ./Backend/face-auth-service
      dockerfile: Dockerfile
    container_name: cognivita-face-auth
    environment:
      FLASK_PORT: 5001
      FLASK_HOST: 0.0.0.0
      FLASK_DEBUG: "False"
      CORS_ORIGINS: http://localhost:4200,http://gateway:8080
    ports:
      - "5001:5001"
    networks:
      - cognivita-network

  # Frontend (Angular)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cognivita-frontend
    ports:
      - "4200:80"
    depends_on:
      - gateway
      - face-auth
    networks:
      - cognivita-network

  # SonarQube - Code Quality Analysis
  sonarqube:
    image: sonarqube:10.4-community
    container_name: cognivita-sonarqube
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - cognivita-network
    restart: unless-stopped

networks:
  cognivita-network:
    driver: bridge

volumes:
  mysql-data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: