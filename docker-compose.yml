version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cognivita_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cognivita}
      MYSQL_USER: ${MYSQL_USER:-cognivita_user}
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD:-cognivita_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./setup_database.sql:/docker-entrypoint-initdb.d/setup_database.sql
    networks:
      - cognivita_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: cognivita_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      PMA_DATABASE: ${MYSQL_DATABASE:-cognivita}
    ports:
      - "8889:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cognivita_network

volumes:
  mysql-data:

networks:
  cognivita_network:
    driver: bridge
